name: codestra-kong

x-kong-environment: &kong-environment
  KONG_DATABASE: postgres
  KONG_PREFIX: /tmp/kong
  KONG_PG_HOST: kong-db
  KONG_PG_PORT: 5432
  KONG_PG_DATABASE: kong
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:?KONG_PG_PASSWORD is required}

services:
  kong-db:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:?KONG_PG_PASSWORD is required}
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      kong_backend:
        ipv4_address: 10.254.42.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  kong-migrations:
    image: kong/kong-gateway@sha256:9cb0429e4641d29189118b20ef0a195569b9d65ef0536bc57907797874071689
    command: kong migrations bootstrap
    restart: "no"
    environment: *kong-environment
    depends_on:
      kong-db:
        condition: service_healthy
    networks:
      - kong_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  kong-gateway:
    image: kong/kong-gateway@sha256:9cb0429e4641d29189118b20ef0a195569b9d65ef0536bc57907797874071689
    restart: unless-stopped
    environment:
      <<: *kong-environment
      KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://127.0.0.1:8002
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TRUSTED_IPS: 172.19.0.0/16,127.0.0.1/32
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_HEADERS: server_tokens,latency_tokens,X-Kong-Request-Id
      KONG_NGINX_HTTP_LOG_FORMAT: >-
        codestra escape=json '{"timestamp":"$$time_iso8601","request_id":"$$request_id","correlation_id":"$$http_x_correlation_id","source_ip":"$$remote_addr","method":"$$request_method","route":"$$uri","status":$$status,"latency":$$request_time,"upstream":"$$upstream_addr"}'
      KONG_PROXY_ACCESS_LOG: /dev/stdout codestra
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout codestra
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      - ./logs:/var/log/kong
    networks:
      kong_backend:
        ipv4_address: 10.254.42.3
      kong_frontend: {}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Observed steady-state is approximately 1.95 GiB. Keep bounded headroom so
    # normal cache growth does not sit at the 90% alert threshold.
    mem_limit: 3g
    cpus: 2.0
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  kong-test-upstream:
    image: nginx@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    user: "101:101"
    volumes:
      - ./config/test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kong_frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
      - /tmp:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  kong_db_data:

networks:
  kong_backend:
    internal: true
    ipam:
      config:
        - subnet: 10.254.42.0/28
  kong_frontend:
    external: true
    name: codestra_edge
