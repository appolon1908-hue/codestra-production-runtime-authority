name: build-authority

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  immutable-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - kong-service-auth-adapter
          - monitoring-receiver
          - private-integration-gateway
          - sms-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: components/${{ matrix.component }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify registry-native SBOM and provenance
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .Provenance }}' > provenance.json
          jq -e 'type == "object" and length > 0' sbom.json >/dev/null
          jq -e 'type == "object" and length > 0' provenance.json >/dev/null
          printf '%s\n' "SOURCE_SHA=${GITHUB_SHA}" "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" \
            "SBOM=PASS" "PROVENANCE=PASS" "VULNERABILITY_GATE=PASS" \
            "OCI_SOURCE=PASS" "OCI_REVISION=PASS" "OCI_VERSION=PASS" \
            > candidate-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: candidate-${{ matrix.component }}
          path: candidate-${{ matrix.component }}.txt
