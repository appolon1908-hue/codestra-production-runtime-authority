name: Validate final immutable candidate matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - "IMMUTABLE-CANDIDATE-MATRIX.yaml"
      - "config/immutable-workload-evidence.v1.schema.json"
      - "tools/validate_immutable_candidate_matrix_final.py"
      - "tests/test_immutable_candidate_matrix_final.py"
      - ".github/workflows/validate-immutable-candidate-matrix-final.yml"
  push:
    branches:
      - main
    paths:
      - "IMMUTABLE-CANDIDATE-MATRIX.yaml"
      - "config/immutable-workload-evidence.v1.schema.json"
      - "tools/validate_immutable_candidate_matrix_final.py"
      - "tests/test_immutable_candidate_matrix_final.py"
      - ".github/workflows/validate-immutable-candidate-matrix-final.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immutable-candidate-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validator-regressions:
    name: Matrix fail-closed regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Run matrix regression suite
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/validate_immutable_candidate_matrix_final.py
          python3 -m unittest tests/test_immutable_candidate_matrix_final.py
          python3 -m json.tool config/immutable-workload-evidence.v1.schema.json >/dev/null
          git diff --check

  final-matrix-gate:
    name: Exact 64-workload immutable matrix gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs:
      - validator-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Verify final matrix
        run: |
          set -Eeuo pipefail
          python3 tools/validate_immutable_candidate_matrix_final.py \
            --matrix IMMUTABLE-CANDIDATE-MATRIX.yaml \
            --expected-workloads 64 \
            --evidence-output "${RUNNER_TEMP}/immutable-candidate-matrix-evidence.json"

      - name: Upload bounded matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immutable-candidate-matrix-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/immutable-candidate-matrix-evidence.json
          if-no-files-found: error
          retention-days: 30
