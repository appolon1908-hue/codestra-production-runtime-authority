name: codestra-kong-service-auth
services:
  adapter:
    build: .
    image: ghcr.io/appolon1908-hue/kong-service-auth-adapter@sha256:517052ebd58f8ae546ffba21598fc1b8357006d60c961d9cda468d2fb25adf4a
    restart: unless-stopped
    environment:
      PORT: "8080"
    volumes:
      - /etc/codestra/secrets/kong-service-auth/sms-gateway-token:/run/secrets/sms_gateway_token:ro
      - /etc/codestra/secrets/kong-service-auth/crm-gateway-secret:/run/secrets/crm_gateway_secret:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
networks:
  edge:
    name: codestra_edge
    external: true
